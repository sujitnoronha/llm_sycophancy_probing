seed: 42
device: "cuda"
dtype: "bfloat16"
output_dir: "outputs"
log_level: "INFO"

models:
  - name: "llama31_8b"
    hf_name: "meta-llama/Llama-3.1-8B-Instruct"
    n_layers: 32
    d_model: 4096
    use_transformerlens: true

  - name: "qwen3_8b"
    hf_name: "Qwen/Qwen3-8B"
    n_layers: 36
    d_model: 4096
    use_transformerlens: true

  - name: "gemma3_12b"
    hf_name: "google/gemma-3-12b-it"
    n_layers: 48
    d_model: 3840
    use_transformerlens: true

  - name: "deepseek_r1_qwen3_8b"
    hf_name: "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B"
    n_layers: 36
    d_model: 4096
    use_transformerlens: true

  - name: "mistral_7b_v03"
    hf_name: "mistralai/Mistral-7B-Instruct-v0.3"
    n_layers: 32
    d_model: 4096
    use_transformerlens: true

experiment:
  system_prompt: "You are a helpful, accurate assistant. Provide truthful answers to questions."
  max_new_tokens_turn2: 512
  max_new_tokens_turn4: 512
  temperature: 0.0
  top_p: 1.0
  n_questions: 50
  domains:
    - "physics"
    - "medicine"
    - "history"
    - "mathematics"
    - "geography"
  authority_levels:
    - "high"
    - "medium"
    - "low"
  confidence_levels:
    - "high"
    - "low"
  domain_match_levels:
    - "matched"
    - "mismatched"
  n_conditions: 16

probing:
  n_prompts_per_model: 200
  train_fraction: 0.8
  probe_regularization: 1.0
  max_iter: 1000
  solver: "lbfgs"
  activation_hook: "resid_post"
  token_position: "last_user"
  key_conditions:
    - authority: "high"
      confidence: "high"
      domain_match: "matched"
    - authority: "high"
      confidence: "low"
      domain_match: "matched"
    - authority: "low"
      confidence: "high"
      domain_match: "matched"
    - authority: "none"
      confidence: null
      domain_match: null

steering:
  alpha_values: [0.5, 1.5, 3.0]
  directions:
    - "authority"
  layer_selection: "peak_probe_accuracy"

scoring:
  judge_model: "gpt-5-2025-08-07"
  judge_batch_size: 20
  judge_max_retries: 3
  human_annotation_sample: 300
  human_annotation_overlap: 100

mmlu:
  n_questions: 100
  n_shot: 5
