[project]
name = "llm-sycophancy-probing"
version = "0.1.0"
description = "Probing the mechanistic link between persona authority and model capitulation across architectures"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    # Core ML
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "transformer-lens>=2.0.0",
    "tokenizers>=0.15.0",

    # Data & compute
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",

    # Statistics
    "statsmodels>=0.14.0",

    # Configuration
    "pydantic>=2.0.0",
    "pyyaml>=6.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Report generation
    "fpdf2>=2.7.0",

    # Logging & utilities
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",

    # LLM Judge
    "openai>=1.0.0",

    # CLI & environment
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.4.0"]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
